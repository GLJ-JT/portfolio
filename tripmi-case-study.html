<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripMi - Protected Case Study</title>
  <meta name="description" content="TripMi is a private product design case study by Joe Tao.">
  <link rel="stylesheet" href="shared/site-nav.css">
  <script src="shared/site-nav.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101011;
      --ink: #f4f1ea;
      --muted: #a9a39a;
      --line: rgba(244, 241, 234, 0.18);
      --panel: rgba(24, 24, 26, 0.88);
      --field: #171719;
      --accent: #09a88a;
      --accent-2: #ff8a3d;
      --body: "Poppins", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    a {
      color: inherit;
      text-underline-offset: 0.2em;
    }

    .gate-shell {
      position: relative;
      display: grid;
      min-height: 100vh;
      padding: clamp(96px, 14vh, 140px) clamp(18px, 4vw, 64px) clamp(32px, 6vh, 72px);
      overflow: hidden;
      isolation: isolate;
    }

    .gate-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(90deg, rgba(16, 16, 17, 0.9), rgba(16, 16, 17, 0.48) 46%, rgba(16, 16, 17, 0.86)),
        url("assets/tripmi-thumbnail.png") center / cover no-repeat;
      filter: saturate(0.94) contrast(1.04);
    }

    .gate-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.46;
      mask-image: linear-gradient(90deg, black, transparent 72%);
    }

    .gate-layout {
      display: grid;
      width: min(1120px, 100%);
      margin: auto;
      grid-template-columns: minmax(0, 0.88fr) minmax(340px, 440px);
      gap: clamp(28px, 5vw, 82px);
      align-items: end;
    }

    .project-mark {
      display: grid;
      gap: 18px;
      align-self: end;
    }

    .project-mark p {
      max-width: 620px;
      margin: 0;
      color: rgba(244, 241, 234, 0.78);
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.42;
    }

    h1 {
      margin: 0;
      font-size: clamp(54px, 10vw, 150px);
      line-height: 0.9;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .gate-panel {
      display: grid;
      gap: 22px;
      width: 100%;
      padding: clamp(24px, 3.4vw, 36px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 28px 96px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(18px);
    }

    .gate-panel h2 {
      margin: 0;
      font-size: clamp(24px, 3.2vw, 36px);
      line-height: 1.04;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .gate-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .password-form {
      display: grid;
      gap: 14px;
    }

    .password-label {
      display: grid;
      gap: 8px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }

    .password-input {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
    }

    .password-input::placeholder {
      color: rgba(244, 241, 234, 0.42);
    }

    .password-input:focus,
    .primary-action:focus-visible,
    .access-link:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .primary-action {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--ink);
      border-radius: 8px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
      font-weight: 900;
    }

    .access-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .access-link {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      border-bottom: 2px solid currentColor;
      color: var(--ink);
      font-weight: 900;
      text-decoration: none;
    }

    .form-feedback {
      min-height: 22px;
      color: var(--accent-2);
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .gate-layout {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .project-mark {
        align-self: start;
      }
    }

    @media (max-width: 560px) {
      .gate-shell {
        padding: 86px 14px 28px;
      }

      .gate-panel {
        padding: 22px 16px;
      }

      .access-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body class="portfolio-nav-no-offset">
  <header class="site-header" aria-label="Site navigation">
    <a class="site-header__name" href="index.html#who-i-am">Joe Tao</a>
    <nav class="site-header__nav" aria-label="Primary navigation">
      <a href="index.html#work">Work</a>
      <a href="index.html#about">About</a>
    </nav>
    <a class="site-header__contact" href="mailto:joe.tianchen.tao@gmail.com">Contact</a>
  </header>

  <main class="gate-shell">
    <section class="gate-layout" aria-labelledby="tripmi-title">
      <div class="project-mark">
        <h1 id="tripmi-title">TripMi</h1>
        <p>Group travel planning, shared decisions, live itinerary updates, and expense settlement in one mobile flow.</p>
      </div>

      <section class="gate-panel" aria-labelledby="gate-title">
        <h2 id="gate-title">This project is password protected.</h2>
        <form class="password-form" data-tripmi-password-form>
          <label class="password-label" for="tripmi-password">
            Password field:
            <input class="password-input" id="tripmi-password" name="password" type="password" autocomplete="current-password" placeholder="Enter password">
          </label>
          <button class="primary-action" type="submit">View project</button>
          <p class="form-feedback" role="status" aria-live="polite"></p>
        </form>
        <p>Need access? Contact me to view.</p>
        <div class="access-row" aria-label="Access links">
          <a class="access-link" href="mailto:joe.tianchen.tao@gmail.com?subject=TripMi%20case%20study%20access&body=Hi%20Joe%2C%0A%0AI%27d%20like%20to%20view%20the%20TripMi%20case%20study.%20Could%20you%20share%20access%3F%0A%0AThanks%2C">Email</a>
          <a class="access-link" href="https://www.linkedin.com/in/joetao/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </div>
      </section>
    </section>
  </main>

  <script>
    document.querySelector("[data-tripmi-password-form]")?.addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const input = form.querySelector("#tripmi-password");
      const feedback = form.querySelector(".form-feedback");
      if (!feedback) return;

      feedback.textContent = input?.value?.trim()
        ? "This private project needs the current access link. Please contact me to view."
        : "Enter password or contact me to view.";
    });
  </script>
</body>
</html>
